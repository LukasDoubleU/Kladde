# Changelog and version bumps from Conventional Commits, see https://git-cliff.org
# Used by .github/workflows/release.yml; preview locally with `npx git-cliff --unreleased`.

[changelog]
header = """
# Changelog

All notable changes to Kladde. Versions follow [Semantic Versioning](https://semver.org), commit messages
[Conventional Commits](https://www.conventionalcommits.org).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/LukasDoubleU/Kladde/releases/tag/{{ version }}) – {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/LukasDoubleU/Kladde/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Commits from before the convention was adopted are listed under "Other changes".
filter_unconventional = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = "^feat", group = "<!-- 00 -->🚀 Features" },
  { message = "^fix", group = "<!-- 01 -->🐛 Bug fixes" },
  { message = "^perf", group = "<!-- 02 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 03 -->♻️ Refactoring" },
  { message = "^docs", group = "<!-- 04 -->📚 Documentation" },
  { message = "^style", group = "<!-- 05 -->🎨 Styling" },
  { message = "^test", group = "<!-- 06 -->🧪 Tests" },
  { message = "^(build|ci)", group = "<!-- 07 -->🏗️ Build and CI" },
  { message = "^chore", group = "<!-- 08 -->🧹 Chores" },
  { message = "^revert", group = "<!-- 09 -->⏪ Reverts" },
  { message = ".*", group = "<!-- 10 -->📝 Other changes" },
]

[bump]
# Before 1.0.0, features and breaking changes bump the minor version, everything else the patch.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
