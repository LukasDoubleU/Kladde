name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$SHA~1..$SHA"
          else
            range="$BEFORE..$SHA"
          fi
          sh scripts/check-commits.sh "$range"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # Starts the real app (debug build, isolated profile), kills it with unsaved changes and checks that
  # everything comes back. Needs the WebView2 runtime, which windows-latest ships with.
  e2e:
    runs-on: windows-latest
    # Non-blocking until the DevTools endpoint works on the runner (#11); run `npm run test:e2e` locally.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx tauri build --debug --no-bundle

      - name: WebView2 runtime
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $found = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv }
          if ($found) { "WebView2 runtime $found" } else { "::warning::No WebView2 runtime found" }
          # Policies and variables that change how WebView2 starts (they can override what an app passes).
          'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge\WebView2',
            'HKLM:\SOFTWARE\WOW6432Node\Policies\Microsoft\Edge\WebView2' |
            Where-Object { Test-Path $_ } |
            ForEach-Object { "Policy $_"; Get-ChildItem $_ -Recurse | Out-String; Get-ItemProperty $_ | Out-String }
          Get-ChildItem env: | Where-Object Name -like 'WEBVIEW2*' | Format-Table -AutoSize | Out-String

      # A quick first check: if the app cannot start on the runner at all, the diagnostics below run
      # instead of every test waiting for its timeout.
      - name: Smoke test
        env:
          KLADDE_E2E_START_TIMEOUT: "90000"
        run: node --test tests/e2e/smoke.test.mjs

      # One app at a time: the runner has few cores, and a cold WebView2 start is slow.
      - name: End-to-end tests
        env:
          KLADDE_E2E_START_TIMEOUT: "90000"
        run: node --test --test-concurrency=1 "tests/e2e/*.test.mjs"

      - name: Diagnostics when the app does not start
        if: failure()
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP "kladde-diag"
          $env:KLADDE_DATA_DIR = "$diag\data"
          $env:KLADDE_DEVTOOLS_PORT = "9399"
          "Interactive: $([Environment]::UserInteractive), session: $((Get-Process -Id $PID).SessionId)"
          $p = Start-Process src-tauri\target\debug\kladde.exe -PassThru -RedirectStandardError "$diag-stderr.txt"
          Start-Sleep -Seconds 30
          Get-Process kladde, msedgewebview2 -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, SessionId, MainWindowTitle -AutoSize | Out-String
          # The browser process (the one without --type) shows the arguments and profile WebView2 really got.
          Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" |
            Where-Object CommandLine -notmatch '--type=' | ForEach-Object { $_.CommandLine }
          netstat -ano | Select-String "LISTENING" | Select-String ":93"
          try { (Invoke-WebRequest http://127.0.0.1:9399/json -UseBasicParsing -TimeoutSec 5).Content } catch { "DevTools endpoint: $_" }
          "--- profile"; Get-ChildItem $diag -Depth 2 -Name -ErrorAction SilentlyContinue
          "--- stderr"; Get-Content "$diag-stderr.txt" -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
