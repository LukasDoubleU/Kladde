# Creates a release on demand: Actions → Release → Run workflow.
#
# The version follows Semantic Versioning and is derived from the Conventional Commits since the
# last release (see cliff.toml), unless a bump is chosen explicitly. The workflow sets the version in
# all files, builds and tests, updates CHANGELOG.md, commits and tags "chore(release): vX.Y.Z" on main
# and publishes a GitHub release with the changelog, the installer, the portable exe and checksums.
#
# With the repository secret TAURI_SIGNING_PRIVATE_KEY (the updater key, see CLAUDE.md) the installer is also
# signed for Kladde's built-in updater and the release carries latest.json and the .sig file. Without the
# secret (forks, first tries) the build works as before, just without update data.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump ("auto" derives it from the commit messages)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false
      dry_run:
        description: Dry run (build and preview the notes, no tag and no release)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are created from main, not ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" = auto ]; then
            tag=$(git cliff --bumped-version)
          else
            tag=$(git cliff --bumped-version --bump "$BUMP")
          fi
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists: there are no new commits since the last release."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Next version: **$tag**" >> "$GITHUB_STEP_SUMMARY"

      - name: Set version
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build
        env:
          # Signs the installer for the updater; empty in forks, then no update data is built.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --config src-tauri/tauri.updater.conf.json
          else
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set: building without update data."
            npm run tauri build
          fi

      - name: Collect files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir release
          setup="src-tauri/target/release/bundle/nsis/Kladde_${VERSION}_x64-setup.exe"
          cp "$setup" release/
          # Update data for the in-app updater: the signature and the manifest it points at.
          if [ -f "$setup.sig" ]; then
            cp "$setup.sig" release/
            node scripts/make-update-manifest.mjs "$VERSION" "$setup" "$GITHUB_REPOSITORY" "$TAG" > release/latest.json
            cat release/latest.json
          fi
          cp src-tauri/target/release/kladde.exe "release/Kladde_${VERSION}_x64_portable.exe"
          (cd release && sha256sum *.exe > SHA256SUMS.txt)
          ls -l release

      - name: Changelog and release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git cliff --tag "$TAG" --output CHANGELOG.md
          git cliff --tag "$TAG" --unreleased --strip header > notes.md
          sed "s/{{VERSION}}/$VERSION/g" .github/release-footer.md >> notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: kladde-${{ steps.version.outputs.version }}-dry-run
          path: |
            release/
            notes.md
            CHANGELOG.md

      - name: Commit, tag and publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json CHANGELOG.md
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Kladde $TAG"
          # Atomic: if main moved meanwhile, neither the commit nor the tag is pushed (rerun the workflow).
          git push --atomic origin HEAD:main "$TAG"
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --verify-tag --title "Kladde $TAG" --notes-file notes.md "${flags[@]}"
